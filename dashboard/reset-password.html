<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>GiGi Beauty | Passwort zurücksetzen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/pages/dashboard.css?v=20261101-19">
<meta name="theme-color" content="#261b17">
<!-- PWA / App -->
<link rel="manifest" href="/dashboard/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="GiGi Admin">
<link rel="apple-touch-icon" href="/public/images/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/public/images/icons/favicon-32.png">
<script src="/assets/js/pwa.js" defer></script>
</head>
<body>
  <div class="login-screen">
    <form class="login-card" id="reset-form">
      <h1>GiGi Beauty</h1>
      <p>Neues Passwort für den geschützten Bereich festlegen</p>
      <div class="field"><label for="reset-password">Neues Passwort</label><input id="reset-password" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field" style="margin-top:1rem"><label for="reset-password-confirm">Passwort bestätigen</label><input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="form-message" id="reset-message"></div>
      <button class="primary" type="submit">Neues Passwort speichern</button>
      <a class="login-link" href="./">Zurück zur Anmeldung</a>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js?v=20260808-1"></script>
  <script src="../assets/js/reset-password.js?v=20260823-1"></script>
  <script src="../assets/js/password-toggle.js"></script>
</body>
</html>

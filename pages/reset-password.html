<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Passwort zurücksetzen | GiGi Beauty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/pages/booking.css?v=20260811-4">
  <style>
    .reset-shell {
      min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem;
      background:
        radial-gradient(circle at 10% 5%, rgba(181, 101, 118, .16), transparent 30rem),
        radial-gradient(circle at 90% 30%, rgba(212, 175, 106, .09), transparent 24rem),
        var(--charcoal);
    }
    .reset-shell .modal { width: min(100%, 460px); }
  </style>
</head>
<body class="booking-page">
  <div class="reset-shell">
    <section class="modal" role="dialog" aria-labelledby="reset-title">
      <span class="modal-eyebrow">GiGi Beauty · Mein Konto</span>
      <h2 id="reset-title">Neues Passwort</h2>
      <p>Leg ein neues, sicheres Passwort für dein GiGi Beauty Konto fest.</p>
      <form class="form-stack" id="reset-form">
        <div class="field"><label for="reset-password">Neues Passwort</label><input id="reset-password" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="reset-password-confirm">Passwort bestätigen</label><input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="form-message" id="reset-message"></div>
        <button class="btn" type="submit">Passwort speichern</button>
      </form>
      <p class="reset-back-link"><a href="./booking.html">Zurück zur Anmeldung</a></p>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/reset-password-customer.js"></script>
  <script src="../assets/js/password-toggle.js"></script>
</body>
</html>
